<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>上元灯会 · 微缩夜街</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23081220%22/><circle cx=%2232%22 cy=%2232%22 r=%2218%22 fill=%22%23ffab55%22/><circle cx=%2232%22 cy=%2232%22 r=%2210%22 fill=%22%23ffdf9d%22/></svg>" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #040a14;
    }
    body {
      position: relative;
      overscroll-behavior: none;
    }
    #scene {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
      opacity: 1;
    }
    #scene:active { cursor: grabbing; }
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 78% 74% at 50% 45%, transparent 48%, rgba(2, 5, 12, .36) 78%, rgba(1, 3, 8, .72) 100%),
        linear-gradient(to bottom, rgba(0, 0, 0, .18), transparent 18%, transparent 80%, rgba(0, 0, 0, .24));
    }

    .effect-dock {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 8;
      display: flex;
      gap: 10px;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .effect-btn {
      pointer-events: auto;
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 42px;
      padding: 0 15px 0 10px;
      color: rgba(239, 220, 181, .82);
      background:
        linear-gradient(180deg, rgba(13, 23, 31, .66), rgba(27, 21, 18, .48));
      border: 1px solid rgba(205, 166, 100, .44);
      border-radius: 3px;
      box-shadow:
        inset 0 0 18px rgba(255, 204, 120, .035),
        0 7px 22px rgba(0, 0, 0, .22);
      backdrop-filter: blur(9px) saturate(1.15);
      -webkit-backdrop-filter: blur(9px) saturate(1.15);
      font-family: "STKaiti", "KaiTi", "FangSong", "Songti SC", "Noto Serif SC", serif;
      font-size: 15px;
      letter-spacing: .18em;
      cursor: pointer;
      overflow: hidden;
      transition:
        transform .28s cubic-bezier(.2, .7, .3, 1),
        background .28s ease,
        border-color .28s ease,
        box-shadow .28s ease,
        color .28s ease;
    }

    .effect-btn::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(212, 173, 105, .14);
      border-radius: 1px;
      pointer-events: none;
      transition: border-color .28s ease;
    }

    .effect-btn::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 219, 154, .9), transparent);
      transform: translateX(-50%);
      transition: width .32s ease;
      pointer-events: none;
    }

    .effect-btn:hover {
      transform: translateY(-2px);
      color: #ffe8b8;
      border-color: rgba(240, 200, 128, .8);
      background:
        linear-gradient(180deg, rgba(25, 35, 40, .74), rgba(49, 34, 23, .58));
      box-shadow:
        inset 0 0 22px rgba(255, 195, 105, .08),
        0 9px 26px rgba(0, 0, 0, .28),
        0 0 18px rgba(233, 176, 91, .11);
    }

    .effect-btn:hover::before {
      border-color: rgba(238, 196, 122, .34);
    }

    .effect-btn:hover::after {
      width: 58%;
    }

    .effect-btn:active {
      transform: translateY(0);
    }

    .effect-btn:focus-visible {
      outline: 1px solid rgba(255, 220, 155, .9);
      outline-offset: 3px;
    }

    .effect-btn.is-on {
      color: #ffe5ad;
      border-color: rgba(241, 191, 104, .82);
      background:
        linear-gradient(180deg, rgba(46, 39, 26, .72), rgba(57, 31, 20, .6));
      box-shadow:
        inset 0 0 24px rgba(255, 186, 83, .12),
        0 8px 26px rgba(0, 0, 0, .26),
        0 0 22px rgba(242, 169, 74, .14);
    }

    .effect-btn.is-on::before {
      border-color: rgba(255, 211, 139, .34);
    }

    .effect-seal {
      width: 23px;
      height: 23px;
      flex: 0 0 23px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(217, 177, 108, .5);
      border-radius: 50%;
      color: rgba(241, 207, 144, .84);
      background: radial-gradient(circle at 40% 35%, rgba(255, 215, 145, .13), rgba(38, 26, 18, .18));
      font-size: 12px;
      line-height: 1;
      letter-spacing: 0;
      transition: border-color .28s ease, background .28s ease, color .28s ease;
    }

    .effect-btn:hover .effect-seal,
    .effect-btn.is-on .effect-seal {
      border-color: rgba(255, 213, 144, .82);
      color: #ffe5ad;
      background: radial-gradient(circle at 40% 35%, rgba(255, 207, 123, .22), rgba(59, 36, 19, .24));
    }

    .effect-label {
      display: inline-block;
      transform: translateY(-.02em);
    }

    .effect-state {
      width: 4px;
      height: 4px;
      flex: 0 0 4px;
      border-radius: 50%;
      background: #d5a75a;
      opacity: .22;
      box-shadow: 0 0 0 rgba(255, 197, 105, 0);
      transition: opacity .3s ease, box-shadow .3s ease, background .3s ease;
    }

    .effect-btn.is-on .effect-state {
      opacity: 1;
      background: #ffd085;
      box-shadow: 0 0 9px rgba(255, 193, 92, .9);
    }

    @media (max-width: 640px) {
      .effect-dock {
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        gap: 7px;
      }
      .effect-btn {
        height: 38px;
        padding: 0 11px 0 8px;
        gap: 6px;
        font-size: 13px;
        letter-spacing: .12em;
      }
      .effect-seal {
        width: 20px;
        height: 20px;
        flex-basis: 20px;
        font-size: 11px;
      }
    }
  </style>
  </head>
<body>
  <canvas id="scene" aria-label="上元灯会微缩三维街景"></canvas>
  <div class="vignette"></div>

  <div class="effect-dock" role="group" aria-label="场景效果">
    <button id="snow-toggle" class="effect-btn" type="button" aria-pressed="false">
      <span class="effect-seal" aria-hidden="true">雪</span>
      <span class="effect-label">落雪</span>
      <span class="effect-state" aria-hidden="true"></span>
    </button>
    <button id="wish-toggle" class="effect-btn" type="button" aria-pressed="false">
      <span class="effect-seal" aria-hidden="true">灯</span>
      <span class="effect-label">祈愿</span>
      <span class="effect-state" aria-hidden="true"></span>
    </button>
  </div>
